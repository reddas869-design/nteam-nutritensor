name: Verify source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-tested.txt
      - run: npm ci
      - run: python -m pip install -c backend/requirements-tested.txt './backend[test]'
      - run: npm test
      - run: npm run build
      - run: python -m pytest backend/tests
      - run: python scripts/count_lines.py
      - run: cmake -S cuda -B cuda/build -DNTEAM_WITH_CUDA=OFF
      - run: cmake --build cuda/build
      - run: ctest --test-dir cuda/build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: static-frontend          
          path: dist
